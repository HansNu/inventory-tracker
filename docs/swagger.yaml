basePath: /api
definitions:
  models.AddAssetReq:
    properties:
      assetCode:
        type: string
      assetName:
        type: string
      brand:
        type: string
      categoryId:
        type: integer
      description:
        type: string
      id:
        type: integer
      location:
        type: string
      purchaseDate:
        type: string
      serialNumber:
        type: string
      status:
        type: string
      user:
        type: string
    required:
    - assetCode
    - assetName
    - categoryId
    - location
    - status
    type: object
  models.AssetCategory:
    properties:
      categoryGroup:
        type: string
      categoryName:
        type: string
      id:
        type: integer
    required:
    - categoryGroup
    - categoryName
    type: object
  models.AssetListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.AssetResponse'
        type: array
      total:
        type: integer
    type: object
  models.AssetResponse:
    properties:
      assetCode:
        type: string
      assetName:
        type: string
      brand:
        type: string
      categoryId:
        type: integer
      categoryName:
        type: string
      createDt:
        type: string
      description:
        type: string
      id:
        type: integer
      location:
        type: string
      purchaseDate:
        type: string
      serialNumber:
        type: string
      status:
        type: string
      updateDt:
        type: string
      user:
        type: string
    type: object
  models.CategoryGroup:
    properties:
      Id:
        type: integer
      groupName:
        type: string
    required:
    - groupName
    type: object
  models.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.RegisterReq:
    properties:
      categoryGroup:
        type: string
      name:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - categoryGroup
    - name
    - password
    - username
    type: object
  models.Users:
    properties:
      categoryGroup:
        type: string
      id:
        type: integer
      name:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: IT asset management API. Most routes require a bearer token from /auth/login.
  title: Inventory Tracker API
  version: "1.0"
paths:
  /addAsset:
    post:
      consumes:
      - application/json
      parameters:
      - description: Asset to create
        in: body
        name: asset
        required: true
        schema:
          $ref: '#/definitions/models.AddAssetReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an asset
      tags:
      - assets
  /addAssetCategory:
    post:
      consumes:
      - application/json
      parameters:
      - description: Category to create
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.AssetCategory'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an asset category
      tags:
      - categories
  /addCategoryGroup:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group to create
        in: body
        name: group
        required: true
        schema:
          $ref: '#/definitions/models.CategoryGroup'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a category group
      tags:
      - category-groups
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Username and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate and receive a JWT
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: New user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.RegisterReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user and receive a JWT
      tags:
      - auth
  /deleteAssetByAssetCode/{assetCode}:
    delete:
      parameters:
      - description: Asset code
        in: path
        name: assetCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an asset by its asset code
      tags:
      - assets
  /deleteAssetCategoryById/{id}:
    delete:
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an asset category
      tags:
      - categories
  /deleteCategoryGroup/{id}:
    delete:
      description: Requires the IT role. A group still referenced by categories returns
        409.
      parameters:
      - description: Category group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a category group
      tags:
      - category-groups
  /getAssetByAssetCode/{assetCode}:
    get:
      parameters:
      - description: Asset code
        in: path
        name: assetCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AssetResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get one asset by its asset code
      tags:
      - assets
  /getAssetCategoryList:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AssetCategory'
            type: array
      security:
      - BearerAuth: []
      summary: List asset categories
      tags:
      - categories
  /getAssetList:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page (max 100)
        in: query
        name: pageSize
        type: integer
      - description: Free-text search across asset fields
        in: query
        name: search
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by category name
        in: query
        name: type
        type: string
      - default: purchase_date
        description: Column to sort by
        in: query
        name: sortField
        type: string
      - default: descend
        description: ascend or descend
        in: query
        name: sortOrder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AssetListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List assets, paged and filtered
      tags:
      - assets
  /getCategoryGroup:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CategoryGroup'
            type: array
      summary: List category groups
      tags:
      - category-groups
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Users'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Return the authenticated user
      tags:
      - auth
  /updateAsset/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Asset ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated fields
        in: body
        name: asset
        required: true
        schema:
          $ref: '#/definitions/models.AddAssetReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update an asset
      tags:
      - assets
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by the token returned by /auth/login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
