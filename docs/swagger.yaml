basePath: /api
definitions:
  models.AssetListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.AssetResponse'
        type: array
      total:
        type: integer
    type: object
  models.AssetResponse:
    properties:
      assetCode:
        type: string
      assetName:
        type: string
      brand:
        type: string
      categoryId:
        type: integer
      categoryName:
        type: string
      createDt:
        type: string
      description:
        type: string
      id:
        type: integer
      location:
        type: string
      purchaseDate:
        type: string
      serialNumber:
        type: string
      status:
        type: string
      updateDt:
        type: string
      user:
        type: string
    type: object
info:
  contact: {}
  description: IT asset management API. Most routes require a bearer token from /auth/login.
  title: Inventory Tracker API
  version: "1.0"
paths:
  /addAsset:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Create an asset
      tags:
      - assets
  /addAssetCategory:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Create an asset category
      tags:
      - categories
  /addCategoryGroup:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Create a category group
      tags:
      - category-groups
  /auth/login:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      summary: Log in and receive a JWT
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      summary: Register a new user
      tags:
      - auth
  /deleteAssetByAssetCode/{assetCode}:
    delete:
      parameters:
      - description: Asset code
        in: path
        name: assetCode
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Delete an asset by its asset code
      tags:
      - assets
  /deleteAssetCategoryById/{id}:
    delete:
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Delete an asset category
      tags:
      - categories
  /deleteCategoryGroup:
    delete:
      description: Requires the IT role.
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Delete a category group
      tags:
      - category-groups
  /getAssetByAssetCode/{assetCode}:
    get:
      parameters:
      - description: Asset code
        in: path
        name: assetCode
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get one asset by its asset code
      tags:
      - assets
  /getAssetCategoryList:
    get:
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: List asset categories
      tags:
      - categories
  /getAssetList:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: pageSize
        type: integer
      - description: Free-text search on code and name
        in: query
        name: search
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by category
        in: query
        name: type
        type: string
      - default: purchase_date
        description: Column to sort by
        in: query
        name: sortField
        type: string
      - default: descend
        description: ascend or descend
        in: query
        name: sortOrder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AssetListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List assets, paged and filtered
      tags:
      - assets
  /getCategoryGroup:
    get:
      produces:
      - application/json
      responses: {}
      summary: List category groups
      tags:
      - category-groups
  /me:
    get:
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get the authenticated user
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by the token returned by /auth/login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
